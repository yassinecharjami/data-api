global:
  scrape_interval: 15s # Intervalle de collecte par défaut
  evaluation_interval: 15s

scrape_configs:
  # 1. Scraping de MinIO
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # 2. Scraping de votre application Spring Boot (Data-Core / Pipeline Worker)
  - job_name: 'spring-boot-worker'
    metrics_path: '/actuator/prometheus'
    # Utilise host.docker.internal si Spring Boot tourne sur votre machine hôte (IntelliJ/Eclipse)
    # Si Spring Boot est aussi un conteneur Docker, mettez son nom (ex: 'data-core:8080')
    static_configs:
      - targets: ['host.docker.internal:8080'] 

  # 3. Scraping de Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']