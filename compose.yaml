services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
  minio:
    image: 'minio/minio:latest'
    environment:
      - 'MINIO_ROOT_USER=access'
      - 'MINIO_ROOT_PASSWORD=minioSecret123'
    command: server /data
    ports:
      - '9000:9000'    
